reports:
  base_dir: "results/reports"
  use_timestamp: true
  directory_prefix: "pytest"
  html: # pytest-html
    enabled: true
    filename: "report.html"
    title: "UCM Pytest Test Report"

database:
  backup: "results/"
  enabled: false # Enable or disable database connection
  host: "127.0.0.1"
  port: 3306
  name: "ucm_pytest"
  user: "root"
  password: "123456"
  charset: "utf8mb4"

# LLM Connection Configuration
llm_connection:
  model: "/home/models/QwQ-32B"
  server_url: "http://127.0.0.1:7800"
  tokenizer_path: "/home/models/QwQ-32B"
  stream: true    # stream output
  ignore_eos: true    # Ignore the returned terminator
  timeout: 180    # request time out

# Sparse Method Accuracy Evaluation Configuration
accuracy_evaluation:
  max_samples: null  # null means use all samples, or set a number like 50 for quick testing
  temperature: 0
  max_tokens: 2048
  # Think model support (e.g., QwQ)
  strip_think: true  # true: extract content after </think> tag; false: use raw output